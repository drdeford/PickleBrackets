{% extends "base.html" %}
{% block content %}
<section class="setup">
  <a class="back" href="{{ url_for('index') }}">← New bracket</a>
  <h1>Player names</h1>
  <p class="subtitle">{{ title }} · {{ n }} players</p>
  <form method="post" action="{{ url_for('submitRR2') }}">
    <input type="hidden" name="setup_token" value="{{ token }}">
    <div class="names">
      {% for i in range(1, n + 1) %}
      <label for="p{{ i }}">Player {{ i }}<input id="p{{ i }}" name="p{{ i }}" type="text" maxlength="40" placeholder="{{ i }}" autocomplete="off"></label>
      {% endfor %}
    </div>
    <button type="submit">Generate matches</button>
  </form>
</section>
{% endblock %}
