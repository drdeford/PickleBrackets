{% extends "base.html" %}
{% block content %}
<section class="setup">
  <h1>Pickleball Brackets</h1>
  <p class="subtitle">Choose your game. Get on court.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('submitRR') }}">
    <div class="fields">
      <label for="system">Play system
        <select id="system" name="system">
          {% for key, label in systems.items() %}<option value="{{ key }}" {% if key == selected %}selected{% endif %}>{{ label }}</option>{% endfor %}
        </select>
      </label>
      <label for="numplay">Players
        <select id="numplay" name="numplay">
          {% for count in range(4, 25) %}<option value="{{ count }}" {% if count == n %}selected{% endif %}>{{ count }}</option>{% endfor %}
        </select>
      </label>
    </div>
    <p class="hint" id="system-note" aria-live="polite">{{ notes[selected] }}</p>
    <label class="checkbox"><input type="checkbox" id="binnames" name="binnames" {% if named %}checked{% endif %}> Enter player names</label>
    <button type="submit">Generate matches</button>
  </form>
</section>
<footer>
  Round robin schedules based on <a href="http://www.jdawiseman.com/papers/tournaments/individual-pairs/individual-pairs-links.html">Julian Wiseman</a> and <a href="http://www.durangobill.com/BridgeCyclicSolutions.html">Durango Bill</a>.
</footer>
<script>
const notes = {{ notes | tojson }};
const system = document.getElementById('system');
const players = document.getElementById('numplay');
function updatePlayers() {
  const fullCourts = !['round_robin', 'random'].includes(system.value);
  for (const option of players.options) option.disabled = fullCourts && Number(option.value) % 4 !== 0;
  if (players.selectedOptions[0].disabled) players.value = String(Math.ceil(Number(players.value) / 4) * 4);
  document.getElementById('system-note').textContent = notes[system.value];
}
system.addEventListener('change', updatePlayers);
updatePlayers();
</script>
{% endblock %}
